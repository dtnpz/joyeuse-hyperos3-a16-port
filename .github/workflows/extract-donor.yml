name: Extract donor userspace

on:
  workflow_dispatch:
  push:
    branches:
      - "extract/**"

permissions:
  contents: read

concurrency:
  group: extract-donor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim ephemeral runner disk
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          for p in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost; do
            if [ -e "$p" ]; then sudo rm -rf "$p"; fi
          done
          sudo apt-get clean || true
          df -h /

      - name: Install payload dumper build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y liblzma-dev android-sdk-libsparse-utils file aria2

      - name: Validate configuration
        run: python3 scripts/validate_config.py

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false

      - name: Build pinned payload dumper
        env:
          PAYLOAD_DUMPER_COMMIT: c3a50ba8d784764c06143c1f82971cd81a77f9d6
        run: |
          set -euo pipefail
          command -v xz
          git clone --filter=blob:none https://github.com/ssut/payload-dumper-go.git tools/payload-dumper-go-src
          git -C tools/payload-dumper-go-src checkout "$PAYLOAD_DUMPER_COMMIT"
          (cd tools/payload-dumper-go-src && go build -o ../payload-dumper-go .)
          tools/payload-dumper-go -h >/dev/null

      - name: Resolve donor
        id: donor
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c=json.load(open("config/donor.json"))
          print("url="+c["url"])
          print("filename="+c["filename"])
          print("md5="+c["md5"])
          PY

      - name: Download and verify donor
        env:
          DONOR_URL: ${{ steps.donor.outputs.url }}
          DONOR_FILE: ${{ steps.donor.outputs.filename }}
          DONOR_MD5: ${{ steps.donor.outputs.md5 }}
        shell: bash
        run: |
          set -euo pipefail
          aria2c --continue=true --max-tries=5 --retry-wait=5 \
            --connect-timeout=30 --timeout=30 \
            --max-connection-per-server=8 --split=8 --min-split-size=16M \
            --file-allocation=none --allow-overwrite=true --auto-file-renaming=false \
            --out="$DONOR_FILE" "$DONOR_URL"
          echo "$DONOR_MD5  $DONOR_FILE" | md5sum -c -
          df -h /

      - name: List payload partitions
        env:
          DONOR_FILE: ${{ steps.donor.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          tools/payload-dumper-go -l "$DONOR_FILE" | tee payload-partitions.txt

      - name: Extract donor userspace only
        env:
          DONOR_FILE: ${{ steps.donor.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          tools/payload-dumper-go -c 2 -p system,system_ext,product -o out "$DONOR_FILE"
          df -h /

      - name: Probe image filesystems
        run: python3 scripts/probe_images.py out

      - name: Collect donor filesystem metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metadata
          for name in system system_ext product; do
            img="out/$name.img"
            [[ -f "$img" ]] || { echo "missing donor image: $img" >&2; exit 1; }
            bash scripts/collect_image_metadata.sh "$img" "donor-$name" metadata
          done
          python3 scripts/build_compat_report.py metadata donor-compat-preflight.md

      - name: Upload extraction report only
        uses: actions/upload-artifact@v4
        with:
          name: creek-OS3.0.304.0-userspace-manifest
          path: |
            payload-partitions.txt
            donor-image-manifest.json
            donor-compat-preflight.md
            metadata/
          retention-days: 14
