name: Validate port config

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pinned donor and target
        run: python3 scripts/validate_config.py
      - name: Check scripts compile
        run: python3 -m py_compile scripts/*.py tests/*.py
      - name: Test super parser and compose planning
        run: python3 tests/test_super_compose.py
