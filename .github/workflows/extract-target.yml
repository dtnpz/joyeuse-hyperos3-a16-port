name: Extract target hardware baseline

on:
  workflow_dispatch:
  push:
    branches:
      - "extract-target/**"

permissions:
  contents: read

concurrency:
  group: extract-target-${{ github.ref }}
  cancel-in-progress: true

env:
  LPTOOLS_COMMIT: 1e13871960cb71ceeba0c780c0878176ca665e53

jobs:
  extract-target:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim ephemeral runner disk
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          for p in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost; do
            if [ -e "$p" ]; then sudo rm -rf "$p"; fi
          done
          sudo apt-get clean || true
          df -h /

      - name: Install sparse-image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils file

      - name: Fetch pinned dynamic-partition tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/lp
          base="https://raw.githubusercontent.com/ravindu644/android-lptools-static-x86_64/$LPTOOLS_COMMIT"
          curl --fail --location --retry 3 -o tools/lp/lpunpack "$base/lpunpack"
          curl --fail --location --retry 3 -o tools/lp/lpdump "$base/lpdump"
          chmod +x tools/lp/lpunpack tools/lp/lpdump

      - name: Validate configuration
        run: python3 scripts/validate_config.py

      - name: Resolve target stock
        id: target
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c=json.load(open("config/target-stock.json"))
          print("url="+c["url"])
          print("filename="+c["filename"])
          print("md5="+c["md5"])
          PY

      - name: Download and verify target stock
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          TARGET_FILE: ${{ steps.target.outputs.filename }}
          TARGET_MD5: ${{ steps.target.outputs.md5 }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --continue-at - -o "$TARGET_FILE" "$TARGET_URL"
          echo "$TARGET_MD5  $TARGET_FILE" | md5sum -c -
          df -h /

      - name: Extract target container/images
        env:
          TARGET_FILE: ${{ steps.target.outputs.filename }}
        run: python3 scripts/extract_target_images.py config/target-stock.json "$TARGET_FILE" target-out

      - name: Delete source archive before expanding super
        env:
          TARGET_FILE: ${{ steps.target.outputs.filename }}
        run: rm -f "$TARGET_FILE" && df -h /

      - name: Prepare vendor/ODM hardware baseline
        run: bash scripts/prepare_target_hardware.sh target-out target-hardware tools/lp

      - name: Probe hardware images
        run: python3 scripts/probe_images.py target-hardware

      - name: Rename generic image report
        run: mv donor-image-manifest.json target-image-manifest.json

      - name: Collect target filesystem metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metadata
          found=0
          for img in target-hardware/*.img; do
            [[ -e "$img" ]] || continue
            case "$(file -b "$img" | tr '[:upper:]' '[:lower:]')" in
              *ext2*|*ext3*|*ext4*|*erofs*)
                label="target-$(basename "$img" .img)"
                bash scripts/collect_image_metadata.sh "$img" "$label" metadata
                found=1
                ;;
            esac
          done
          [[ "$found" == 1 ]] || { echo "no mountable target filesystem images found" >&2; exit 1; }
          python3 scripts/build_compat_report.py metadata target-compat-preflight.md

      - name: Upload target hardware report only
        uses: actions/upload-artifact@v4
        with:
          name: joyeuse-V14.0.3.0-hardware-manifest
          path: |
            target-extract-map.json
            target-image-manifest.json
            target-super-layout.txt
            target-super-layout.json
            target-compat-preflight.md
            metadata/
          if-no-files-found: warn
          retention-days: 14
